<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f5">
  <title>Konto – Husly</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <header class="site-head">
    <a class="brand" href="./" id="brand"></a>
    <nav id="head-nav"></nav>
  </header>

  <main class="narrow">
    <div class="auth-card">
      <div id="state-loading">
        <h2>Et øyeblikk …</h2>
        <p class="sub">Sjekker lenken.</p>
      </div>

      <form id="form-new" novalidate hidden>
        <h2>Lag et nytt passord</h2>
        <p class="sub">Velg et passord med minst 8 tegn.</p>
        <div class="field">
          <label class="label" for="np1">Nytt passord</label>
          <input class="input" id="np1" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label class="label" for="np2">Gjenta passordet</label>
          <input class="input" id="np2" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-error" data-error hidden style="margin-top:14px"></div>
        <button class="btn btn-block" type="submit">Lagre passord</button>
      </form>

      <div id="state-error" hidden>
        <h2>Lenken virker ikke</h2>
        <p class="sub" id="error-text" style="margin-top:8px"></p>
        <a class="btn btn-block" href="./">Til innlogging</a>
      </div>
    </div>
  </main>

  <script>
    qs('#brand').innerHTML = brandMark() + '<span>Husly</span>';
    qs('#head-nav').innerHTML = themeToggle();

    function show(id) {
      ['state-loading', 'form-new', 'state-error'].forEach((x) => { qs('#' + x).hidden = x !== id; });
    }
    function fail(msg) {
      qs('#error-text').textContent = msg;
      show('state-error');
    }
    function goApp() {
      let code = '';
      try { code = localStorage.getItem('husly-kode') || ''; } catch (e) {}
      location.replace('app.html' + (code ? `?kode=${code}` : ''));
    }

    (async () => {
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.slice(1));
      const tokenHash = params.get('token_hash');
      const type = params.get('type');

      if (hash.get('error_description') || params.get('error_description')) {
        return fail(errMsg(hash.get('error_description') || params.get('error_description')));
      }
      if (!tokenHash || !type) {
        return fail('Lenken mangler informasjon. Be om en ny lenke fra innloggingssiden.');
      }

      const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type });
      history.replaceState(null, '', location.pathname);
      if (error) return fail(errMsg(error));

      if (type === 'recovery') {
        show('form-new');
        qs('#np1').focus();
      } else {
        goApp();
      }
    })();

    qs('#form-new').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.currentTarget;
      const box = qs('[data-error]', form);
      const p1 = qs('#np1').value;
      const p2 = qs('#np2').value;
      box.hidden = true;
      if (p1.length < 8) { box.textContent = 'Passordet må ha minst 8 tegn.'; box.hidden = false; return; }
      if (p1 !== p2) { box.textContent = 'Passordene er ikke like.'; box.hidden = false; return; }
      await withBusy(e.submitter, async () => {
        const { error } = await sb.auth.updateUser({ password: p1 });
        if (error) { box.textContent = errMsg(error); box.hidden = false; return; }
        toast('Passordet er lagret');
        setTimeout(goApp, 600);
      });
    });
  </script>
</body>
</html>
